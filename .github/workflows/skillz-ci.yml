name: Skillz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - docs/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -- lint
      - run: cargo run -- sync
      - run: git diff --quiet || echo "Changes detected, please update skills on this branch."