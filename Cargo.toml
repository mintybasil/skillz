[package]
name = "skillz"
version = "0.1.0"
edition = "2021"
description = "Manage agent skills across deployments — sync from external sources via git submodules"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
walkdir = "2"
anyhow = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"